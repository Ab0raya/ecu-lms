services:
  - type: web
    name: ecu-lms-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DEMO_MODE
        value: "false"
      - key: LMS_BASE_URL
        value: "https://lms.ecu.edu.eg"
